name: Crypto Analysis Bot

on:
  #schedule:
    # Run every 5 hours at 17 minutes past the hour
  #  - cron: '17 */5 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  analyze:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.14
    
    - name: Install dependencies
      working-directory: ./core
      run: uv sync
    
    - name: Run crypto analysis
      working-directory: ./core
      env:
        TAVILY_API: ${{ secrets.TAVILY_API }}
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        BINANCE_USE_TESTNET: ${{ secrets.BINANCE_USE_TESTNET }}
        BINANCE_TRADING_ENABLED: ${{ secrets.BINANCE_TRADING_ENABLED }}
        BINANCE_TRADE_AMOUNT_USDT: ${{ secrets.BINANCE_TRADE_AMOUNT_USDT }}
        BINANCE_TP_MIN: ${{ secrets.BINANCE_TP_MIN }}
        BINANCE_TP_MAX: ${{ secrets.BINANCE_TP_MAX }}
        BINANCE_SL_MIN: ${{ secrets.BINANCE_SL_MIN }}
        BINANCE_SL_MAX: ${{ secrets.BINANCE_SL_MAX }}
        TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: uv run python src/main.py
    
    - name: Upload results (if CSV enabled)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crypto-analysis-results-${{ github.run_number }}
        path: core/*.csv
        if-no-files-found: ignore
